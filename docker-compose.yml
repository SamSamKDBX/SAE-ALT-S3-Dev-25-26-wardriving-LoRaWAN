services:
  wardriving:
    build: ./Code-M5Stack
    ports:
      - "8080:5000"
    volumes:
      - wardriving-data:/data
    environment:
      - DATA_FILE=/data/data.json
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_PORT=${MQTT_PORT}
      - M5STACK_ID=${M5STACK_ID}
    restart: unless-stopped

volumes:
  wardriving-data:
