services:
  wardriving:
    build: ./Code-M5Stack
    ports:
      - "8080:5000"
    volumes:
      - wardriving-data:/data
    environment:
      - DATA_FILE=/data/data.json
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_USE_TLS=${MQTT_USE_TLS}
      - M5STACK_ID=${M5STACK_ID}
      - DEVEUI_PREFIX=${DEVEUI_PREFIX}
      - CHIRPSTACK_APP_ID=${CHIRPSTACK_APP_ID}
      - MQTT_TOPIC_TEMPLATE=${MQTT_TOPIC_TEMPLATE}
    restart: unless-stopped

volumes:
  wardriving-data:
